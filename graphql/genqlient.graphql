fragment SecretFragment on Secret {
    name
    digest
    createdAt
}

query GetFullApp($name: String) {
    app(name: $name) {
        name
        network
        organization {
            id
            slug
        }
        autoscaling {
            preferredRegion
            regions {
                code
            }
        }
        appUrl
        hostname
        id
        status
        deployed
        platformVersion
        currentRelease {
            id
        }
        config {
            definition
        }
        healthChecks {
            nodes {
                name
                status
            }
        }
        ipAddresses {
            nodes {
                address
                id
            }
        }
        role {
            name
        }
    }
}

fragment AppFragment on App {
    id
    name
    organization {
        id
        slug
    }
    autoscaling {
        preferredRegion
    }
    secrets {
        name
        createdAt
        digest
    }
    appUrl
    platformVersion
    role {
        name
    }
}

query GetApp($name: String) {
    # @genqlient(flatten: true)
    app(name: $name) {
        ...AppFragment
    }
}

mutation CreateAppMutation($input: CreateAppInput!) {
    createApp(input: $input) {
        # @genqlient(flatten: true)
        app {
            ...AppFragment
        }
    }
}


mutation DeleteAppMutation($name: ID!) {
    deleteApp(appId: $name) {
        organization {
            name
        }
    }
}

query OrgsQuery {
    organizations {
        nodes {
            name
            id
        }
    }
}

mutation UpdateAutoScaleConfigMutation($id: ID!, $regions: [AutoscaleRegionConfigInput!], $resetRegions: Boolean) {
    updateAutoscaleConfig(input: {
        resetRegions: $resetRegions,
        regions: $regions,
        appId: $id
    }) {
        app {
            status
            autoscaling {
                regions {
                    code
                }
            }
        }
    }
}

query VolumeQuery($app: String, $internal: String!) {
    app(name: $app) {
        volume(internalId: $internal) {
            name
            region
            id
            internalId
            region
            sizeGb
        }
    }
}

mutation CreateVolume($app: ID!, $name: String!, $region: String!, $sizeGb: Int!) {
    createVolume(input: {appId: $app, name: $name, region: $region, sizeGb: $sizeGb}) {
        volume {
            name
            region
            id
            internalId
            region
            sizeGb
        }
    }
}


mutation DeleteVolume($volume: ID!) {
    deleteVolume(input: {volumeId: $volume}) {
        clientMutationId
    }
}

query IpAddressQuery($id: ID!) {
    ipAddress(id: $id) {
        id
        type
        address
        region
    }
}

mutation AllocateIpAddress($app: ID!, $region: String, $addrType: IPAddressType!) {
    allocateIpAddress(input: {
        appId: $app,
        region: $region,
        type: $addrType
    }) {
        ipAddress {
            id
            type
            address
            region
        }
    }
}

mutation ReleaseIpAddress($addressId: ID!) {
    releaseIpAddress(input: {ipAddressId: $addressId}) {
        app {
            name
        }
    }
}

query GetCertificate($app: String!, $hostname: String!) {
    app(name: $app) {
        certificate(hostname: $hostname) {
            id
            dnsValidationInstructions
            dnsValidationHostname
            dnsValidationTarget
            hostname
            check
        }
    }
}

mutation AddCertificate($app: ID!, $hostname: String!) {
    addCertificate(appId: $app, hostname: $hostname) {
        certificate {
            id
            dnsValidationInstructions
            dnsValidationHostname
            dnsValidationTarget
            hostname
            check
        }
    }
}

mutation DeleteCertificate($app: ID!, $hostname: String!) {
    deleteCertificate(appId: $app, hostname: $hostname) {
        app {
            name
        }
        certificate {
            hostname
            id
        }
    }
}

mutation CreatePostgresCluster(
    $name: String,
    $orgid: ID!,
    $region: String,
    $password: String,
    $vmsize: String,
    $volumesize: Int,
    $count: Int,
    $imageref: String
) {
    createPostgresCluster(input: {
        name: $name,
        organizationId: $orgid,
        region: $region,
        password: $password,
        vmSize: $vmsize,
        volumeSizeGb: $volumesize
        count: $count,
        imageRef: $imageref
    }) {
        app {
            name
        }
        username
        password
    }
}

mutation AddWireguardPeer(
    $input: AddWireGuardPeerInput!
) {
    addWireGuardPeer(input: $input) {
        network
        endpointip
        peerip
        pubkey
    }
}

mutation RemoveWireguardPeer(
    $input: RemoveWireGuardPeerInput!
){
    removeWireGuardPeer(input: $input) {
        organization {
            name
        }
    }
}

mutation SetSecrets($input: SetSecretsInput!) {
    setSecrets(input: $input) {
        app {
            # @genqlient(flatten: true)
            secrets {
                ...SecretFragment
            }
        }
    }
}

mutation UnsetSecrets($appId: ID!, $keys: [String!]!) {
    unsetSecrets(input: {
        appId: $appId,
        keys: $keys
    }) {
        app {
            # @genqlient(flatten: true)
            secrets {
                ...SecretFragment
            }
        }
    }
}

query GetSecrets($name: String!) {
    app(name: $name) {
        # @genqlient(flatten: true)
        secrets {
            ...SecretFragment
        }
    }
}

query Organization($id: ID, $name: String, $slug: String) {
    organization(id: $id, name: $name, slug: $slug) {
        id
        slug
        name
        type
        members {
            edges {
                node {
                    id
                    name
                    email
                }
                joinedAt
                role
            }
        }
    }
}

mutation CreateAccessToken($name: String!) {
    createAccessToken(input: {name: $name}) {
        accessToken {
            id
            name
            token
            createdAt
        }
    }
}

mutation DeleteAccessToken($id: ID!) {
    deleteAccessToken(input: {accessTokenId: $id}) {
        clientMutationId
    }
}

query GetAccessTokens {
    accessTokens {
        nodes {
            name
            id
            createdAt
            token
        }
    }
}

fragment LimitedAccessToken on LimitedAccessToken {
    id
    name
    token
    tokenHeader
    createdAt
    expiresAt
    organization {
        name
        id
    }
    user {
        name
        id
    }
}

mutation CreateLimitedAccessToken($input: CreateLimitedAccessTokenInput!) {
    createLimitedAccessToken(input: $input) {
        limitedAccessToken {
            id
            name
            token
            tokenHeader
            createdAt
            expiresAt
            organization {
                id
                name
            }
            user {
                id
                name
            }
        }
    }
}

mutation DeleteLimitedAccessToken($id: ID!) {
    deleteLimitedAccessToken(input: {token: $id}) {
        clientMutationId
    }
}

query LimitedAccessTokens {
    apps {
        nodes {
            limitedAccessTokens {
                nodes {
                    id
                    name
                    token
                    tokenHeader
                    createdAt
                    expiresAt
                    organization {
                        id
                        name
                    }
                    user {
                        id
                        name
                    }
                }
            }
        }
    }
}