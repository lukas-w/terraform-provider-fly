name: Tests

on:
  pull_request_target:
    types: [labeled]
    paths-ignore:
      - 'README.md'
  push:
    branches-ignore: ["dependabot/**"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.23'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'safe to test')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - run: make build

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.3.*'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_AUTH_TOKEN_CI }}
      FLY_TF_TEST_ORG: ${{ secrets.FLY_TF_TEST_ORG }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: go mod download
      - run: make generate

      - run: go test -v -cover ./internal/provider/
        env:
          TF_ACC: "1"
        timeout-minutes: 10

      - run: |
          go test -v -sweep any ./internal/provider
        if: ${{ always() }}
